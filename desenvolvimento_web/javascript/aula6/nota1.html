<!-- DOM - Document Object Model -->
 <!-- interface que permite os scripts acessarem e atualizares dinamicamente 
  a estrutura e contudo e estilo de documentos -->

  <!DOCTYPE html>
  <html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM</title>
  </head>
  <body>
    <input id="meuId" type="text"></input>
        <button onclick="console. log(document.getElementById('meuId') .value)">Obter Texto</button>
  </body>
  </html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>onload - BOM</title>
    <script>
        window.onload = function() { // evento onload é disparado quando a página é carregada
            document.forms [0].elements [0].value = 'Vitor Manuel'; // acessa o primeiro formulário da página e o primeiro elemento do formulário e atribui um valor a ele
            document.forms [0].elements[1].value = 'Silva';
        }
    </script>
</head>
<body>
    <form action="" method="get">
        
        <input type="text" />
        
        <input type="text" />
    
    </form>
</body>
</html>
